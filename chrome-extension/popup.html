<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanSurat UNKRIS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.0"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
        sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 400px;
      width: 380px;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header {
      background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
      color: white;
      padding: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .status-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .status-card.connected {
      border-color: #22c55e;
      background: #f0fdf4;
    }

    .status-card.disconnected {
      border-color: #ef4444;
      background: #fef2f2;
    }

    .status-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .status-value {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .indicator-connected {
      background: #22c55e;
    }

    .indicator-disconnected {
      background: #cbd5e1;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #1e40af;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1e3a8a;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #1e293b;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #cbd5e1;
    }

    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .alert-info {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd;
    }

    .alert-warning {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .data-preview {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
    }

    .data-field {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f1f5f9;
    }

    .data-field:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .data-label {
      color: #64748b;
      font-weight: 600;
    }

    .data-value {
      color: #1e293b;
      font-weight: 500;
    }

    .setup-required {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      color: #92400e;
      font-size: 13px;
    }

    .setup-required p {
      margin-bottom: 12px;
    }

    .footer {
      border-top: 1px solid #e2e8f0;
      padding: 12px 16px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ScanSurat UNKRIS</h1>
      <p>PC Bridge - Form Filler</p>
    </div>

    <div class="content">
      <!-- Status Section -->
      <div class="section">
        <div class="status-grid">
          <div class="status-card disconnected" id="bridgeStatus">
            <div class="status-label">PC Bridge</div>
            <div class="status-value">
              <span class="status-indicator indicator-disconnected"></span>Offline
            </div>
          </div>
          <div class="status-card disconnected" id="websiteStatus">
            <div class="status-label">Website</div>
            <div class="status-value">
              <span class="status-indicator indicator-disconnected"></span>Offline
            </div>
          </div>
        </div>
      </div>

      <!-- Setup Required Alert -->
      <div id="setupAlert" class="setup-required">
        <p><strong>Setup Diperlukan</strong></p>
        <p>Jalankan PC Bridge dan hubungkan website untuk memulai.</p>
      </div>

      <!-- Connection Controls -->
      <div class="section">
        <div class="section-title">Koneksi</div>
        <div class="button-group">
          <button class="btn-primary" id="connectBtn" onclick="handleConnect()">
            Hubungkan ke Website
          </button>
          <button class="btn-secondary" id="disconnectBtn" onclick="handleDisconnect()" style="display: none">
            Putuskan Koneksi
          </button>
        </div>
      </div>

      <!-- Scan Data Preview -->
      <div class="section" id="dataSection" style="display: none">
        <div class="section-title">Data Scan Terbaru</div>
        <div class="data-preview" id="dataPreview">
          <p style="color: #94a3b8; text-align: center">Menunggu data...</p>
        </div>
      </div>

      <!-- Form Fill Controls -->
      <div class="section" id="formSection" style="display: none">
        <div class="section-title">Form Portal</div>
        <div class="button-group">
          <button class="btn-primary" id="fillFormBtn" onclick="handleFillForm()">
            Isi Form
          </button>
          <button class="btn-secondary" onclick="window.open('https://puskom.unkris.ac.id/letters/create', '_blank')">
            Buka Portal
          </button>
        </div>
      </div>

      <!-- Status Messages -->
      <div id="statusMessages"></div>
    </div>

    <div class="footer">
      <p>v1.0.0 (Stage 2) • Hubungi support jika ada masalah</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
